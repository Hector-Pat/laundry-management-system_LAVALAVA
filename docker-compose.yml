services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: lavalavabd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Solo se ejecuta la primera vez que el volumen esta vacio; ya incluye
      # todo lo que en instalaciones existentes se aplica via
      # backend/database/migrations/.
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: lavalavabd
      JWT_SECRET: ${JWT_SECRET:-cambia_esta_clave_por_una_segura}
      JWT_EXPIRES_IN: 2h
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
